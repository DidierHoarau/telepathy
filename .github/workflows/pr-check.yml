name: PR Check

on:
  pull_request:
    branches: ["main"]

  workflow_dispatch:

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            telepathy-agent/package-lock.json
            telepathy-server/package-lock.json
            telepathy-web/package-lock.json

      - name: Build, lint and test Agent
        working-directory: telepathy-agent
        run: |
          npm ci
          npm run build
          npm run lint
          npm run test

      - name: Build, lint and test Server
        working-directory: telepathy-server
        run: |
          npm ci
          npm run build
          npm run lint
          npm run test

      - name: Build, lint and test Web
        working-directory: telepathy-web
        run: |
          npm ci
          npm run build
          npm run lint
          npm run test

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker images
        run: |
          set -e
          docker buildx build --platform linux/amd64 --load -f Dockerfile-server -t telepathy:pr .
          docker buildx build --platform linux/amd64 --load -f Dockerfile-agent-alpine -t telepathy-agent:pr .
          docker buildx build --platform linux/amd64 --load -f Dockerfile-agent-ubuntu -t telepathy-agent:pr-ubuntu .
